# Publishes to npm when a v* tag is pushed.
#
# There is deliberately no NPM_TOKEN. Publishing uses npm trusted publishing over
# OIDC, so the only thing that can publish this package is this workflow, in this
# repository — there is no long-lived credential to leak, rotate, or steal. Every
# tarball carries a provenance attestation linking it to the commit and the run
# that built it, which anyone can verify with `npm audit signatures`.
#
# One-time setup on npmjs.com: package settings -> Trusted publisher -> GitHub
# Actions, repository fabriziosalmi/slopless, workflow release.yml.
name: release

on:
  push:
    # Semver tags only. `v*` also matched the moving `v1` tag that the Action
    # points at, so every release tried to publish twice.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # to create the GitHub release
  id-token: write   # required for OIDC and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in the repo settings to make
    # every publish a deliberate, approved act rather than a side effect of a tag.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: the tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Publish only what CI already proved. A tag is not a licence to skip this.
      - run: npm test
      - run: npm run build
      - name: the bundled CLI in git must match the source
        run: git diff --exit-code dist/index.js
      # ci.yml checks this on every push, and five releases went out while it was
      # failing there, because a release watches its own run and not that one.
      # A version that ships rules the published docs do not describe is wrong in
      # the place users read, so the guard belongs on both paths.
      - name: the published docs must describe the rules being released
        run: |
          npm run docs:gen
          git diff --exit-code docs/rules docs/changelog.md docs/index.md README.md || {
            echo "Generated content is stale. Run: npm run docs:gen && git add -A"
            exit 1
          }
      - name: the bundle must run with no node_modules
        run: npm run verify:bundle

      # The first publish of a scoped package cannot come from here: npm's trusted
      # publisher is configured per package, and the package has to exist first.
      # Until then a tag should say so plainly rather than leave a failed run.
      - name: can this publish from CI yet?
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        if: steps.registry.outputs.published == 'true'
        run: npm publish --provenance --access public

      - name: explain why nothing was published
        if: steps.registry.outputs.published != 'true'
        run: |
          echo "::notice title=Publish skipped::The package is not on npm yet. Publish it once by hand with a granular token, configure the trusted publisher for this workflow at npmjs.com, then revoke the token. Every tag after that publishes from here with provenance and no stored credential."

      # A tag, an npm version and a GitHub release are three records of the same
      # thing, and creating the third by hand is how they drift: 1.4.2 reached npm
      # while the Marketplace still read 1.4.1 from the last release anyone made.
      - name: create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release exists::$TAG already has a GitHub release."
            exit 0
          fi
          node scripts/changelog-notes.js "$TAG" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
