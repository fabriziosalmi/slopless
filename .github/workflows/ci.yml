name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: the bundled CLI in git must match the source
        run: |
          git diff --exit-code dist/index.js && exit 0
          echo "dist/index.js is stale. Run: npm run build && git add dist/index.js"
          echo "Expect this on any dependency bump — the bundle inlines its"
          echo "dependencies, so Dependabot changing a version changes the bundle,"
          echo "and Dependabot cannot rebuild it. Rebuild on the branch and push."
          exit 1
      - name: the bundle must run with no node_modules
        run: npm run verify:bundle
      - name: the generated docs and rule counts in git must match the rules
        run: |
          npm run docs:gen
          git diff --exit-code docs/rules docs/changelog.md docs/index.md docs/languages.md README.md || {
            echo "Generated content is stale. Run: npm run docs:gen && git add -A"
            echo "The rule count is quoted in prose in several files and is rewritten"
            echo "from the real count, so adding a rule changes them all."
            exit 1
          }
      - name: the docs site must build
        run: npm run docs:build
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: slopless on itself, as the published Action
        uses: ./
        with: { patterns: "src/**/*.ts" }
