name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: the bundled CLI in git must match the source
        run: |
          git diff --exit-code dist/index.js && exit 0
          echo "dist/index.js is stale. Run: npm run build && git add dist/index.js"
          echo "Expect this on any dependency bump — the bundle inlines its"
          echo "dependencies, so Dependabot changing a version changes the bundle,"
          echo "and Dependabot cannot rebuild it. Rebuild on the branch and push."
          exit 1
      - name: the bundle must run with no node_modules
        run: npm run verify:bundle
      - name: the generated docs and rule counts in git must match the rules
        run: |
          npm run docs:gen
          git diff --exit-code docs/rules docs/changelog.md docs/index.md docs/languages.md README.md || {
            echo "Generated content is stale. Run: npm run docs:gen && git add -A"
            echo "The rule count is quoted in prose in several files and is rewritten"
            echo "from the real count, so adding a rule changes them all."
            exit 1
          }
      - name: the docs site must build
        run: npm run docs:build
  # The extension's package.json pointed `main` at a file its own build script
  # never produced, and nothing said so — it was not on the Marketplace, not in
  # the npm package, and not buildable, while the README said it shipped. A job
  # that builds it is the thing that would have caught that.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: the VS Code extension must build and package
        working-directory: packages/vscode-slopless
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run package
      - name: what package.json declares as the entry point must exist
        working-directory: packages/vscode-slopless
        run: |
          main=$(node -p "require('./package.json').main")
          test -f "$main" || { echo "main is $main and nothing produced it"; exit 1; }
          test -f server/out/server.js || { echo "the client starts server/out/server.js, which is missing"; exit 1; }
          test -f rules/VBC-001.yaml || { echo "the rules were not copied into the extension"; exit 1; }
      - name: the MCP server must build and answer
        working-directory: packages/mcp-slopless
        run: |
          npm install --no-audit --no-fund
          npm run build
          node ../../scripts/probe-mcp.js
      - name: every package must carry the same version
        run: node scripts/sync-versions.js --check
      # So a pull request can be installed and tried, rather than only read.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: slopless-vsix
          path: packages/vscode-slopless/slopless.vsix
          if-no-files-found: error

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Everything, not just src/. The panel showed what the narrow pattern was
      # hiding: rule files, scripts, the two packages, the docs and the
      # changelog were never read by the check that is supposed to be this
      # tool's own proof.
      - name: slopless on itself, as the published Action
        uses: ./
        with:
          patterns: >-
            src/**/*.ts scripts/*.js scripts/*.ts packages/*/src/**/*.ts
            packages/*/*.js rules/*.yaml *.md docs/*.md .github/workflows/*.yml
