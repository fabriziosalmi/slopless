name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: the bundled CLI in git must match the source
        run: git diff --exit-code dist/index.js || { echo "dist/index.js is stale — run npm run build and commit it"; exit 1; }
      - name: the bundle must run with no node_modules
        run: npm run verify:bundle
      - name: the rule docs in git must match the rules
        run: |
          npm run docs:gen
          git diff --exit-code docs/rules || { echo "docs/rules is stale — run npm run docs:gen and commit it"; exit 1; }
      - name: the docs site must build
        run: npm run docs:build
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: slopless on itself, as the published Action
        uses: ./
        with: { patterns: "src/**/*.ts" }
