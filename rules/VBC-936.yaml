id: VBC-936
name: outdated-experimental-tag
severity: warning
category: docs
tags:
  - docs
  - maintenance
match:
  # `^[ \t]*`, not `^\s*`: with `m` every line start is a match position and
  # `\s*` there swallows the newlines after it, which is quadratic on a file of
  # blank lines. A blockquote marker is indented by horizontal whitespace.
  regex: >-
    \[\s*(?:EXPERIMENTAL|ALPHA|UNSTABLE|PREVIEW)\s*\]|(?:⚠️|:warning:)\s*\*{0,2}(?:experimental|alpha|unstable)\b|^[ \t]*>\s*\*{0,2}(?:experimental|unstable)\b
  flags: im
  file_types:
    - md
    - txt
message: >-
  Experimental or alpha status tag '{match}' at line {line}. If this feature has been in production
  for more than six months, remove the disclaimer. Stale warnings erode trust in documentation
  accuracy and prevent users from adopting stable APIs.
tests:
  fire:
    - '[EXPERIMENTAL] The plugin API may change.'
  quiet:
    - Sort the entries in alphabetical order.
    - The plugin API is stable.
