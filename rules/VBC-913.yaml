id: VBC-913
name: outline-none-hazard
severity: error
tags:
  - accessibility
  - ux
match:
  regex: outline:\s*none|outline:\s*0
  file_types:
    - css
    - scss
  exclude:
    - ':focus'
    - ':active'
message: >-
  Removing outlines without providing a focus state at line {line} breaks
  keyboard accessibility.
category: ux-dx
