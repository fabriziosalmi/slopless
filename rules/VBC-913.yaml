id: VBC-913
name: outline-none-hazard
severity: error
category: ux-dx
tags:
  - accessibility
  - ux
match:
  regex: >-
    outline:\s*(?:none|0)\b(?![\s\S]{0,400}?:focus-visible[\s\S]{0,140}?outline\s*:\s*(?!none|0|\s*;))
  multiline: true
  # An outline only ever appears on focus, so removing one matters only where
  # focus can land. `.card { outline: none }` on a div nobody can tab to removes
  # nothing; the same line under `:focus-visible` removes the only thing telling
  # a keyboard user where they are.
  require_selectors:
    - ':focus'
    - ':active'
    - a
    - button
    - input
    - select
    - textarea
    - summary
    - details
    - '[tabindex]'
    - '[contenteditable]'
  file_types:
    - css
    - scss
message: >-
  Focus outline removed at line {line} with nothing replacing it. Keyboard users lose all
  sense of position. Pair it with a :focus-visible rule that draws a visible ring, which is
  what this rule looks for before reporting.
tests:
  fire:
    - 'a:focus { outline: none; }'
    - 'input[type="range"]:focus-visible { outline: none; }'
    - '.editor:focus-visible { outline: none !important; }'
  quiet:
    - 'a:focus { outline: 2px solid currentColor; }'
    - '.card { cursor: default; outline: none; overflow: hidden; }'
    - '.ProseMirror { outline: none; min-height: 100vh; }'
    - |
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 3px solid #0ff;
      }
