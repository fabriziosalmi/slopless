id: VBC-935
name: colloquial-language
severity: warning
tags:
  - docs
  - style
match:
  regex: \b(touch base|circle back|deep dive|low-hanging fruit|move the needle|game changer|paradigm shift|the whole nine yards|ballpark figure|boil the ocean|drink the kool-aid|drink the koolaid)\b
  flags: i
  file_types:
    - md
    - txt
message: >-
  Corporate colloquialism or buzzword '{match}' in documentation at line {line}.
  Jargon and idioms are confusing for non-native English speakers and make
  documentation sound unprofessional. Use plain, direct language.
category: docs
