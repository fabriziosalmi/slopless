id: VBC-096
name: complex-regex-no-comment
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: /(?:[^/\n\\]|\\.){30,}/[dgimsuvy]*
  file_types:
    - js
    - ts
message: >-
  Long regular expression literal at line {line} with no explanation. Add a comment stating
  what it matches, or build it from named parts.
tests:
  fire:
    - const re = /^[a-z0-9]+(?:[-_][a-z0-9]+)*@example\.com$/;
  quiet:
    - const re = /^\d+$/;
