id: VBC-940
name: float-currency-arithmetic
severity: error
tags:
  - security
  - correctness
  - ai-error
match:
  regex: >-
    \b(price|amount|total|cost|fee|tax|discount|balance|rate)\s*[*\/\+\-]=?\s*0\.[0-9]|\b(price|amount|total|cost|fee|tax|discount|balance)\s*=\s*[a-zA-Z_]+\s*[*\/]\s*[a-zA-Z_]+
  file_types:
    - js
    - ts
    - py
message: >-
  Floating-point arithmetic on monetary value '{match}' at line {line}.
  Float imprecision causes rounding errors in financial calculations (e.g.
  0.1 + 0.2 != 0.3). Use integer cents/minor units or a dedicated decimal
  library (decimal.js, big.js, Python's Decimal) for all money math.
category: security
