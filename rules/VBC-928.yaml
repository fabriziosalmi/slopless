id: VBC-928
name: lorem-ipsum-docs
severity: error
category: docs
tags:
  - documentation
  - slop
match:
  regex: Lorem ipsum dolor sit amet
  flags: i
  scan: all
  file_types:
    - md
    - txt
    - html
    - js
    - ts
    - py
    - go
    - rs
    - java
    - sh
