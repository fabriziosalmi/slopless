id: VBC-928
name: lorem-ipsum-docs
severity: error
category: docs
tags:
  - documentation
  - slop
match:
  regex: Lorem ipsum dolor sit amet
  flags: i
  scan: all
  # A corpus that tests for placeholder text is full of placeholder text. This
  # rule found `Lorem ipsum dolor sit amet.` inside the table of a Go test for a
  # gate that detects exactly that.
  exclude_test_code: true
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/*_test.go'
    - '**/*_test.rs'
    - '**/*.test.*'
    - '**/*.spec.*'
  file_types:
    - md
    - txt
    - html
    - js
    - ts
    - py
    - go
    - rs
    - java
    - sh
    - tsx
    - jsx
    - c
    - cpp
    - cs
    - kt
    - swift
    - rb
    - astro
message: >-
  Placeholder text 'Lorem ipsum' detected at line {line}. Replace with real content before
  committing.
tests:
  fire:
    - Lorem ipsum dolor sit amet, consectetur.
  quiet:
    - Real documentation content.
