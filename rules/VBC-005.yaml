id: VBC-005
name: use-var
severity: error
tags:
  - best-practice
match:
  # exempt `declare var` (ambient/global declarations — `var` is the correct keyword there)
  regex: '(?<!\bdeclare\s+)\bvar\b'
  skip_comments: true   # never flag the word "var" inside a comment
  file_types:
    - js
    - ts
message: Use of 'var' detected at line {line}. Use 'let' or 'const' instead.
category: core
fix:
  regex_replace:
    pattern: '(?<!\bdeclare\s+)\bvar\b'
    replacement: 'let'
