id: VBC-005
name: use-var
severity: error
category: core
tags:
  - best-practice
match:
  regex: (?<!\bdeclare\s{1,4})\bvar\b
  file_types:
    - js
    - ts
fix:
  regex_replace:
    pattern: \bvar\b
    replacement: let
message: Use of 'var' detected at line {line}. Use 'let' or 'const' instead.
tests:
  fire:
    - var total = 0;
  quiet:
    - const total = 0;
    - let total = 0;
    - file: global.d.ts
      code: 'declare var sampleRate: number;'
