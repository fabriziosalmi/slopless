id: VBC-042
name: too-many-comments
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: (?:^[ \t]*//.*\n){10,}
  flags: m
  multiline: true
  scan: all
  exclude_doc_comments: true
  file_types:
    - js
    - ts
    - py
    - astro
message: >-
  Too many consecutive comment lines at line {line}. Code should be self-documenting.
tests:
  fire:
    # Below the first line of code, so it is commentary rather than a header.
    - |
      const answer = 42;
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
      // filler comment line
  quiet:
    - |
      // one explanatory comment
      const answer = 42;
    # A banner at the top of a file explains what the file is. Counting it as
    # excess commentary reported 79 module headers in one project.
    - |
      // ─────────────────────────────
      // Wasm Core Bridge
      //
      // Lazy-loads the Rust module.
      // All functions go through this singleton.
      //
      // Usage:
      //   import { core } from './bridge';
      //   const c = await core();
      //
      // ─────────────────────────────
      import { core } from './bridge';
