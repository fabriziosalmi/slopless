id: VBC-007
name: float-for-currency
severity: error
category: security
tags:
  - security
  - clean-code
match:
  regex: >-
    \b(?:(?:price|amount|cost|fee|fees|balance|payment|subtotal|tax)(?![a-z])|[a-z_$]+(?:Price|Amount|Cost|Fee|Fees|Balance|Payment|Subtotal|Tax)(?![a-z]))[A-Za-z_$]*\s*[:=]\s*[0-9]+\.[0-9]+
  file_types:
    - js
    - ts
    - py
message: >-
  Monetary value declared as a floating point literal at line {line}. Binary floats cannot
  represent decimal cents exactly. Store money as integer minor units or use a decimal type.
tests:
  fire:
    - const unitPrice = 19.99;
    - let taxRate = 0.22;
    - 'totalCost: 4.50'
  quiet:
    - const unitPriceCents = 1999;
    - const ratio = 0.22;
    - const feedback = 0.5;
    - const coffee = 1.5;
    - const taxonomy = 0.9;
