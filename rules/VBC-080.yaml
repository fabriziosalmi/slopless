id: VBC-080
name: browser-alert
severity: error
category: clean-code
tags:
  - ux
match:
  regex: \balert\(
  file_types:
    - js
    - ts
    - astro
message: >-
  Avoid using alert() at line {line}. Use a modern UI notification system.
tests:
  fire:
    - alert("saved");
  quiet:
    - showToast("saved");
