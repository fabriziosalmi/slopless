id: VBC-901
name: hardcoded-ip-v4
severity: warning
category: security
tags:
  - security
match:
  regex: >-
    \b(?!127\.|0\.0\.0\.0\b)(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\b
  scan: strings
  file_types:
    - js
    - ts
    - py
    - go
    - java
    - json
    - env
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/test.py'
    - '**/conftest.py'
    - '**/*_test.go'
    - '**/*_bench.go'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/bench/**'
    - '**/benchmark*'
    - '**/*corpus*'
    - '**/*payload*'
message: >-
  Hardcoded IP address at line {line}. It pins the code to one environment. Read it from configuration.
  Loopback and 0.0.0.0 are not reported: they name this machine rather than a particular host.
tests:
  fire:
    - const host = '192.168.1.50';
    - const dns = "8.8.8.8";
  quiet:
    - const host = process.env.DB_HOST;
    - const version = '1.2';
    - const local = '127.0.0.1';
    - const bind = '0.0.0.0';
