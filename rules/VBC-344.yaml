id: VBC-344
name: non-iso-date
severity: warning
category: docs
tags:
  - docs
match:
  regex: >-
    \b(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/(19|20)\d\d\b|\d{1,2}-\d{1,2}-\d{4}
  file_types:
    - md
    - txt
message: >-
  Non-ISO 8601 date found at line {line}. Use YYYY-MM-DD to avoid regional confusion.
tests:
  fire:
    - Released on 03/14/2026.
  quiet:
    - Released on 2026-03-14.
