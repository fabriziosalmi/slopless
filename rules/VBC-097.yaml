id: VBC-097
name: br-tags-for-layout
severity: warning
category: ux-dx
tags:
  - html
  - accessibility
match:
  regex: <br\s*/?>(\s*<br\s*/?>)+
  multiline: true
  file_types:
    - html
    - js
    - ts
    - tsx
    - astro
message: Multiple <br> tags used for layout. Use CSS margin or padding instead.
tests:
  fire:
    - <p>one<br /><br />two</p>
  quiet:
    - <p>one<br />two</p>
