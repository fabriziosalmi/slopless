id: VBC-098
name: z-index-war
severity: warning
category: clean-code
tags:
  - css
match:
  regex: z-index\s*:\s*[0-9]{4,}
  file_types:
    - css
    - scss
    - less
message: Extremely high z-index value detected at line {line} (z-index wars).
tests:
  fire:
    - '.modal { z-index: 99999; }'
  quiet:
    - '.modal { z-index: 10; }'
