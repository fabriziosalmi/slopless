id: VBC-334
name: ai-generated-fluff
severity: warning
tags:
  - docs
  - content
match:
  regex: >-
    (As an AI language model|It's important to remember that|In
    conclusion,|Let's dive into|the landscape of|tapestry of|delve
    into|unleash|unlocking|delving into|testament to)
  flags: i
  file_types:
    - md
    - txt
message: >-
  Potential AI-generated fluff or overused cliché '{match}' detected at line
  {line}. Keep documentation concise and human-centric.
category: docs
