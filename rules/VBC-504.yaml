id: VBC-504
name: semantic-shadowing
severity: warning
category: clean-code
tags:
  - clean-code
  - semantic
match:
  semantic_check: semantic-shadowing
message: >-
  Variable '{name}' shadows a common library or system keyword. This can cause confusion during
  debugging.
tests:
  fire:
    - const path = req.query.path;
    - const fs = createFakeFs();
  quiet:
    - const filePath = req.query.path;
    - const fakeFs = createFakeFs();
    - const res = await api.getNotes();
    # Importing a module under its own name is not shadowing it. This is how
    # every Node file in existence spells it, and it was twelve of the twelve
    # findings this rule produced against slopless itself.
    - const fs = require('fs');
    - const path = require('path');
    - const crypto = require('node:crypto');
