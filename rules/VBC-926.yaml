id: VBC-926
name: short-commit-message-check
severity: warning
category: git
tags:
  - git
  - dx
match:
  git_check: commit_message_too_short
  threshold: 10
message: >-
  Commit message is likely too short. Provide more context about the 'why' of your changes.
