id: VBC-903
name: eval-like-timers
severity: error
category: security
tags:
  - security
match:
  regex: (setTimeout|setInterval)\s*\(\s*['"].*?['"]
  file_types:
    - js
    - ts
    - astro
message: Passing strings to timers is eval-like and insecure at line {line}.
tests:
  fire:
    - setTimeout("poll()", 100);
  quiet:
    - setTimeout(poll, 100);
