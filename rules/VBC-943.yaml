id: VBC-943
name: ignored-catch-variable
severity: warning
tags:
  - clean-code
  - ai-error
match:
  regex: catch\s*\(\s*_[a-zA-Z]?\s*\)\s*\{
  file_types:
    - js
    - ts
message: >-
  Catch clause with ignored error variable at line {line}. Using '_' as the
  catch binding signals the exception is intentionally discarded. AI-generated
  code often silently suppresses errors this way, hiding failures in
  production. Either log the error, re-throw with context, or add an explicit
  comment explaining why suppression is safe here.
category: clean-code
