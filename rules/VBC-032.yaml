id: VBC-032
name: css-important
severity: warning
category: core
tags:
  - style
  - css
match:
  regex: '!important'
  file_types:
    - css
    - scss
    - less
message: >-
  Global '!important' detected in CSS at line {line}. This breaks the cascade.
tests:
  fire:
    - '.card { color: red !important; }'
  quiet:
    - '.card { color: red; }'
