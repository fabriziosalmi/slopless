id: VBC-020
name: justify-text-web
severity: warning
tags:
  - ux
  - accessibility
match:
  regex: text-align:\s*justify
  file_types:
    - css
    - scss
    - less
message: >-
  text-align:justify detected at line {line}. Justified text creates uneven
  "rivers of white space" between words that make text significantly harder to
  read, particularly for users with dyslexia. Use left-aligned text for body
  copy.
category: ux-dx
