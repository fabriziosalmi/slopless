id: VBC-421
name: filler-words
severity: warning
category: docs
tags:
  - docs
  - style
match:
  regex: \b(essentially|actually|literally)\b
  flags: i
  file_types:
    - md
opt_in: true
message: >-
  Filler word detected at line {line}. Be more direct in your documentation.
tests:
  fire:
    - This is essentially a cache.
  quiet:
    - This is a cache.
