id: VBC-503
name: collection-naming-vibes
severity: warning
category: clean-code
tags:
  - clean-code
  - semantic
match:
  semantic_check: collection-suffix
message: >-
  Array named '{name}' is missing a plural 's' or a collection suffix (List, Array). This
  makes code less intuitive.
tests:
  fire:
    - const user = [1, 2, 3];
  quiet:
    - const users = [1, 2, 3];
    - const userList = [1];
    # The suffix check was case-insensitive and the plural was not, so a
    # constant array shouting its own name was told to add the s it ends with.
    - const LANGUAGES = ['ts', 'py'];
    - const RULE_IDS = ['VBC-001'];
