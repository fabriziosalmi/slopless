id: VBC-910
name: console-table-leaks
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: console\.table\(
  file_types:
    - js
    - ts
    - tsx
    - astro
message: >-
  console.table() left in code at line {line}. Useful for debug, but clutters production logs.
tests:
  fire:
    - console.table(rows);
  quiet:
    - renderTable(rows);
