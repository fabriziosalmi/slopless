id: VBC-003
name: chmod-777
severity: error
category: core
tags:
  - security
match:
  regex: chmod\s+777
  file_types:
    - sh
    - py
    - js
  # The same decision as the paths below, for languages that keep their
  # tests in the file they test.
  exclude_test_code: true
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/test.py'
    - '**/conftest.py'
    - '**/*_test.go'
    - '**/*_bench.go'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/bench/**'
    - '**/benchmark*'
    - '**/*corpus*'
    - '**/*payload*'
message: Insecure chmod 777 detected at line {line}
tests:
  fire:
    - chmod 777 /srv/app
  quiet:
    - chmod 640 /srv/app
