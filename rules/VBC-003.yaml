id: VBC-003
name: chmod-777
severity: error
category: core
tags:
  - security
match:
  regex: chmod\s+777
  file_types:
    - sh
    - py
    - js
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/conftest.py'
    - '**/fixtures/**'
message: Insecure chmod 777 detected at line {line}
tests:
  fire:
    - chmod 777 /srv/app
  quiet:
    - chmod 640 /srv/app
