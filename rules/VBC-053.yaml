id: VBC-053
name: redundant-interpolation
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: '`\$\{[a-zA-Z0-9_]+\}`'
  scan: all
  file_types:
    - js
    - ts
    - tsx
    - astro
message: >-
  Redundant string interpolation detected at line {line}. Use the variable directly.
tests:
  fire:
    - const label = `${count}`;
  quiet:
    - const label = `${count} items`;
