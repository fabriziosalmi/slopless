id: VBC-023
name: notification-permission-eager
severity: error
tags:
  - ux
  - security
match:
  regex: Notification\.requestPermission\(
  file_types:
    - js
    - ts
message: >-
  Notification.requestPermission() detected at line {line}. Requesting browser
  notification permissions immediately on page load is hostile UX that causes
  most users to click "Block" by default. Only request permissions in direct
  response to an explicit user action that requires notifications.
category: ux-dx
