id: VBC-019
name: absolute-paths
severity: error
category: core
tags:
  - security
  - portability
match:
  regex: '[''"]/Users/|[''"]/home/|[''"]C:\\'
  scan: strings
  file_types:
    - js
    - ts
    - py
    - sh
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/test.py'
    - '**/conftest.py'
    - '**/*_test.go'
    - '**/*_bench.go'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/bench/**'
    - '**/benchmark*'
    - '**/*corpus*'
    - '**/*payload*'
message: >-
  Hardcoded absolute path '{match}' detected at line {line}. This breaks system portability
  and leaks local structure.
tests:
  fire:
    - const home = '/Users/fab/project';
    - const win = 'C:\\Users\\fab';
  quiet:
    - const home = path.join(os.homedir(), 'project');
