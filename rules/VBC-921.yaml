id: VBC-921
name: hardcoded-outdated-year
severity: warning
category: docs
tags:
  - documentation
  - maintenance
match:
  regex: (?:©|\(c\)|Copyright)\s*(?:19|20)\d{2}(?!\s*[-–—]\s*(?:19|20)?\d{2})
  flags: i
  scan: all
  file_types:
    - md
    - txt
    - js
    - ts
message: >-
  Copyright notice pinned to a single year at line {line}. It is stale the moment the year
  turns. Use a range (2020-present) or generate the year at build time.
tests:
  fire:
    - Copyright 2024 Acme Ltd.
  quiet:
    - Copyright 2020-2026 Acme Ltd.
