id: VBC-921
name: hardcoded-outdated-year
severity: warning
category: docs
tags:
  - documentation
  - maintenance
match:
  file_types:
    - md
    - txt
    - js
    - ts
    - tsx
    - jsx
    - css
    - py
    - go
    - rs
    - html
  # The same decision as the paths below, for languages that keep their
  # tests in the file they test.
  exclude_test_code: true
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/test.py'
    - '**/conftest.py'
    - '**/*_test.go'
    - '**/*_bench.go'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/bench/**'
    - '**/benchmark*'
    - '**/*corpus*'
    - '**/*payload*'
  heuristic_check: stale-copyright-year
message: >-
  Copyright notice ends at a year that has passed: {match}. It is now {year}. Use a range
  ending in the current year, or generate the year at build time.
tests:
  external: >-
    heuristic-checker.test.ts: compares against the year the run happens in
