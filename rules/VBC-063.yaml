id: VBC-063
name: empty-else
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: else\s*\{\s*\}
  file_types:
    - js
    - ts
    - tsx
    - py
    - astro
message: Empty else block detected at line {line}. This clutters the code.
tests:
  fire:
    - if (ready) { start(); } else {}
  quiet:
    - if (ready) { start(); } else { stop(); }
