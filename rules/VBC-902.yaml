id: VBC-902
name: document-write-slop
severity: error
category: security
tags:
  - security
  - performance
match:
  regex: document\.write\(
  file_types:
    - js
    - ts
    - tsx
    - astro
message: >-
  document.write() is prohibited at line {line}. It is insecure and performance-heavy.
tests:
  fire:
    - document.write("<p>hi</p>");
  quiet:
    - container.append(paragraph);
