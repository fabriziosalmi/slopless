id: VBC-058
name: overly-long-variable-name
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: \b(let|const|var)\s+[a-zA-Z0-9_]{35,}\b
  file_types:
    - js
    - ts
    - tsx
    - astro
message: >-
  Overly long variable name (>35 chars) detected at line {line}. This is getting too vibey.
tests:
  fire:
    - const theAbsolutelyEnormousConfigurationObject = {};
  quiet:
    - const config = {};
