id: VBC-338
name: non-inclusive-terminology
# Off unless the config names it, like the other rules about how prose is worded:
# it is a stance rather than a defect, and it was 1,615 findings across 43
# repositories, nearly all of them the two words it exists to report. A project
# that holds the stance turns it on, and keeps its own vocabulary for the domain
# uses (an audio master bus, a repository that is literally about blocklists).
opt_in: true
severity: warning
category: docs
tags:
  - docs
  - inclusive-language
match:
  regex: >-
    \bmaster[\s/-]?slave\b|\bslaves?\b|\bmaster\s+(?:branch|node|server|database|db|key|process|replica|copy)\b|\b(?:origin/)?master\b(?=\s*(?:branch\b|$))|\bblacklist(?:ed|ing)?\b|\bwhitelist(?:ed|ing)?\b|\bsanity[-
    ]check\b
  flags: i
  scan: all
  # A contributing guide that says "use Main/Replica instead of Master/Slave", or
  # a code span showing `git push origin master`, mentions the term; it does not
  # use it. 28% of this rule's findings in Markdown were inside code.
  exclude_markdown_code: true
  file_types:
    - md
    - txt
    - js
    - ts
    - tsx
    - py
    - astro
message: >-
  Non-inclusive terminology at line {line}. Prefer main, primary/replica, allowlist/blocklist,
  and a plain "check". Domain uses such as an audio master bus or a mastering chain are not
  reported.
tests:
  fire:
    - Push to the master branch.
    - Add the host to the whitelist.
  quiet:
    - Push to the main branch.
    - Add the host to the allowlist.
    - Master section accent colour.
    - 'To rename the branch, run `git branch -m master main`.'
    - |
      ```sh
      git push origin master
      ```
    - The audio mastering chain.
