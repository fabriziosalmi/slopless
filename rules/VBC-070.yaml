id: VBC-070
name: use-innerhtml
severity: error
category: core
tags:
  - security
match:
  regex: >-
    \.innerHTML\s*=(?!=)(?!\s*(['"])(?:(?!\1)[^\\])*\1\s*[;\n])
  file_types:
    - js
    - ts
message: >-
  Use of 'innerHTML' detected at line {line}. Use 'textContent' or a sanitizer to avoid XSS.
tests:
  fire:
    - el.innerHTML = markup;
    - el.innerHTML = "<b>" + name + "</b>";
    - el.innerHTML = `<b>${name}</b>`;
  quiet:
    - el.textContent = text;
    - alert.innerHTML = '<i class="fa-check"></i> <span id="t"></span>';
    - el.innerHTML = "";
    - if (el.innerHTML === "") { init(); }
