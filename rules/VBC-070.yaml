id: VBC-070
name: use-innerhtml
severity: error
category: core
tags:
  - security
match:
  # A literal has no injection point, and neither does a run of them joined with
  # `+`: a tip string split over three lines for readability is still a constant.
  # A template literal is one too, until it contains `${`: a backtick string with
  # nothing interpolated is a constant that happens to span lines, which is how
  # markup is usually written. That was 19% of this rule's 210 findings across 90
  # repositories. `= \`<b>${name}</b>\`` still fires.
  regex: >-
    \.innerHTML\s*=(?!=)(?!\s*(?:(['"])(?:(?!\1)[^\\])*\1|`(?:[^`\\$]|\\[\s\S]|\$(?!\{))*`|\s|\+)+[;\n])
  # The exclusion has to see the lines after the `=`, which line-by-line
  # matching cannot.
  multiline: true
  exclude_test_code: true
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/*.test.*'
    - '**/*.spec.*'
  file_types:
    - js
    - ts
    - tsx
    - astro
message: >-
  Use of 'innerHTML' detected at line {line}. Use 'textContent' or a sanitizer to avoid XSS.
tests:
  fire:
    - el.innerHTML = markup;
    - el.innerHTML = "<b>" + name + "</b>";
    - el.innerHTML = `<b>${name}</b>`;
    # Beside the exclusion: one interpolation anywhere in the template is enough.
    - |
      el.innerHTML = `
        <p class="muted">Hello</p>
        <b>${name}</b>
      `;
    - el.innerHTML = `<b>` + name + `</b>`;
  quiet:
    - el.textContent = text;
    - alert.innerHTML = '<i class="fa-check"></i> <span id="t"></span>';
    # A template with nothing interpolated is a constant that spans lines.
    - |
      panel.innerHTML = `
        <p class="muted">Webhook service unavailable</p>
      `;
    - 'box.innerHTML = `<i class="x"></i>`;'
    - el.innerHTML = "";
    # A tip split over several lines for readability is still a constant.
    - |
      el.innerHTML =
        "Tip: try <code>/status</code>, " +
        "or <code>/help</code> for all commands.";
    - if (el.innerHTML === "") { init(); }
