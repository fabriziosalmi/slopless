id: VBC-905
name: debug-console-usage
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: console\.(count|time|timeEnd|trace|profile)\(
  file_types:
    - js
    - ts
    - astro
message: Debug console method '{line}' left in code. Remove before committing.
tests:
  fire:
    - console.time("boot");
  quiet:
    - metrics.start("boot");
