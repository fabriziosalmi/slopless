id: VBC-077
name: deceptive-function-name
severity: error
category: clean-code
tags:
  - clean-code
  - semantic
match:
  ast_check:
    type: lying-function-names
message: >-
  Lying function name detected: '{name}' implies a non-mutating action but contains side-effect
  keywords (set, delete, update). This is major vibecoding.
tests:
  fire:
    - |
      function getUser(id) {
        this.cache.set(id, 1);
        return id;
      }
    - |
      class E {
        getLevel() {
          if (!this.buf) { this.hits = this.hits + 1; }
          return this.buf;
        }
      }
  quiet:
    - |
      function getUser(id) {
        return this.users[id];
      }
    - |
      function getOffset(node) {
        return node.dataset.offset;
      }
    - |
      class E {
        getMasterLevel() {
          if (!this.buf || this.buf.length !== this.analyser.fftSize) {
            this.buf = new Float32Array(this.analyser.fftSize);
          }
          return rms(this.buf);
        }
      }
    - |
      class R {
        async fetchFromRemote(url) {
          this.fetched = true;
          return fetch(url);
        }
      }
    - |
      function getAll() {
        const out = [];
        for (const x of this.buffer) out.push(x);
        return out;
      }
