id: VBC-197
name: hardcoded-node-version
severity: warning
category: ux-dx
tags:
  - dx
  - portability
match:
  regex: node\s+-v|node\s+--version
  file_types:
    - sh
    - json
message: >-
  Hardcoded system version check detected at line {line}. Use an .nvmrc or engine field in
  package.json instead.
tests:
  fire:
    - file: fixture.sh
      code: node -v
  quiet:
    - file: fixture.sh
      code: node build.js
