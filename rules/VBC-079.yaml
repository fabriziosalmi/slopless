id: VBC-079
name: debugger-statements
severity: error
category: clean-code
tags:
  - clean-code
match:
  regex: debugger;
  file_types:
    - js
    - ts
    - astro
message: >-
  debugger; statement found at line {line}. This should never reach production.
tests:
  fire:
    - debugger;
  quiet:
    - inspect(state);
