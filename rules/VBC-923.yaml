id: VBC-923
name: filename-too-long-hazard
severity: warning
category: git
tags:
  - git
  - cross-platform
match:
  git_check: filename_too_long
  threshold: 50
message: >-
  Filename length {length} exceeds {threshold} characters. This might cause issues on some
  systems.
tests:
  external: 'git-checker.test.ts: needs a staged file list'
