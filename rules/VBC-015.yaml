id: VBC-015
name: magic-numbers
severity: warning
category: clean-code
tags:
  - clean-code
match:
  regex: >-
    (?<!\w)(?<!(?:const|let|var|static|final)\s{1,4}[A-Za-z_$][\w$]{0,60}\s{0,4}=\s{0,4})(?:86400|3600|1000|60)(?![\w.])
  file_types:
    - js
    - ts
    - py
  # The same decision as the paths below, for languages that keep their
  # tests in the file they test.
  exclude_test_code: true
  exclude_files:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/testdata/**'
    - '**/fixtures/**'
    - '**/test_*.py'
    - '**/*_test.py'
    - '**/test.py'
    - '**/conftest.py'
    - '**/*_test.go'
    - '**/*_bench.go'
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/bench/**'
    - '**/benchmark*'
    - '**/*corpus*'
    - '**/*payload*'
message: >-
  Magic number '{match}' detected at line {line}. Consider using a named constant (e.g., SECONDS_IN_DAY).
tests:
  fire:
    - setTimeout(retry, 1000);
    - const expiry = now + 86400;
  quiet:
    - const ONE_SECOND_MS = 1000;
    - const port = 10001;
