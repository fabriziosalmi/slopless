id: VBC-215
name: global-pollutant
severity: error
category: clean-code
tags:
  - clean-code
  - security
match:
  regex: >-
    window\.(?!location\b|on[a-z]+\b|name\b|opener\b|status\b|document\b|history\b|scrollX\b|scrollY\b|top\b|self\b|parent\b)[a-zA-Z0-9_$]+\s*=(?!=)
  file_types:
    - js
    - ts
message: >-
  Global variable pollution detected (window.prop = ...). Use modules or proper state management.
tests:
  fire:
    - window.myApp = createApp();
  quiet:
    - window.location = target;
    - window.onload = init;
    - if (window.myApp === undefined) { boot(); }
