id: VBC-022
name: custom-cursor-css
severity: warning
tags:
  - ux
match:
  regex: cursor:\s*url\s*\(
  file_types:
    - css
    - scss
    - less
message: >-
  Custom cursor via CSS url() at line {line}. Custom cursors are often laggy,
  pixel-inaccurate, and confusing for users who rely on their cursor to interact
  with native OS elements. This is a hallmark of style-over-function design.
category: ux-dx
