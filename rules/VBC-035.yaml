id: VBC-035
name: aria-label-icon-button
severity: error
tags:
  - accessibility
match:
  regex: <button(?![^>]*(aria-label|aria-labelledby|title))[^>]*>\s*<svg
  file_types:
    - html
    - tsx
    - jsx
message: >-
  Icon-only button without aria-label at line {line}. A button containing only
  an SVG icon has no accessible name, making it completely opaque to screen
  readers. Add aria-label="Descriptive action" to every icon-only button.
category: ux-dx
