name: "Slopless Static Analysis"
description: "Static analysis against AI-slop code: 148 rules, AST checkers, optional type-check, SARIF output."
author: "Fabrizio Salmi"
branding: { icon: "check-circle", color: "green" }
inputs:
  patterns:
    description: "Glob patterns to lint (space-separated). Empty = staged files."
    default: "**/*.ts"
  config:
    description: "Path to slopless.config.json"
    default: ""
  format:
    description: "Output format: default | json | sarif"
    default: "default"
  type-check:
    description: "Enable deep semantic type analysis (slower)"
    default: "false"
  args:
    description: "Extra CLI arguments, verbatim"
    default: ""
  output:
    description: "Write the report to this file instead of the log. Required to upload SARIF."
    default: ""
runs:
  using: composite
  steps:
    # Inputs are passed through the environment rather than interpolated into the
    # command text, so a value can never become shell source.
    - shell: bash
      env:
        SLOPLESS_DIR: ${{ github.action_path }}
        SLOPLESS_PATTERNS: ${{ inputs.patterns }}
        SLOPLESS_CONFIG: ${{ inputs.config }}
        SLOPLESS_FORMAT: ${{ inputs.format }}
        SLOPLESS_TYPE_CHECK: ${{ inputs.type-check }}
        SLOPLESS_ARGS: ${{ inputs.args }}
        SLOPLESS_OUTPUT: ${{ inputs.output }}
      run: |
        set -uo pipefail
        # Patterns must reach the CLI intact: with globstar off, bash rewrites
        # `src/**/*.ts` as `src/*/*.ts` and silently drops everything at the top
        # level. Disabling pathname expansion leaves the globbing to the CLI,
        # which is what the pattern was written for.
        set -f
        argv=()
        [ -n "$SLOPLESS_CONFIG" ] && argv+=(--config "$SLOPLESS_CONFIG")
        [ "$SLOPLESS_FORMAT" != "default" ] && argv+=(--format "$SLOPLESS_FORMAT")
        [ "$SLOPLESS_TYPE_CHECK" = "true" ] && argv+=(--type-check)
        argv+=(--no-cache)

        # Patterns and extra args are deliberately word-split: both are lists.
        # shellcheck disable=SC2086
        if [ -n "$SLOPLESS_OUTPUT" ]; then
          # Redirecting straight at the target would create it before the run, so a
          # crash would leave a truncated report that looks finished to whatever
          # consumes it. Build it aside and only publish a complete one. Note that
          # exit 1 means errors were found, not that the run failed: the report is
          # valid and must still be published.
          tmp="$(mktemp)"
          node "$SLOPLESS_DIR/dist/index.js" $SLOPLESS_PATTERNS "${argv[@]}" $SLOPLESS_ARGS > "$tmp"
          status=$?

          usable=1
          if [ ! -s "$tmp" ]; then
            usable=0
          elif [ "$SLOPLESS_FORMAT" = "json" ] || [ "$SLOPLESS_FORMAT" = "sarif" ]; then
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$tmp" 2>/dev/null || usable=0
          fi

          if [ "$usable" = "1" ]; then
            mv "$tmp" "$SLOPLESS_OUTPUT"
            echo "Report written to $SLOPLESS_OUTPUT"
          else
            rm -f "$tmp"
            echo "::warning title=No report written::slopless produced no usable $SLOPLESS_FORMAT report, so $SLOPLESS_OUTPUT was not created. Anything gating on that file will skip rather than consume a partial one."
            [ "$status" = "0" ] && status=1
          fi
        else
          node "$SLOPLESS_DIR/dist/index.js" $SLOPLESS_PATTERNS "${argv[@]}" $SLOPLESS_ARGS
          status=$?
        fi
        exit $status
